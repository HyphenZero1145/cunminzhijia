<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>B站视频测试JSONP</title>
</head>
<body>
<script>
function jsonpCallback(data) {
  console.log("回调收到，code:", data.code);
  if (data.code === 0) {
    console.log("总视频数:", data.data.page.count);
    console.log("第一页视频:", data.data.list.vlist.map(v => ({bvid: v.bvid, title: v.title, author: v.author})));
  } else {
    console.log("接口返回:", data.message);
  }
  document.title = "code:" + data.code;
}
</script>
<script src="https://api.bilibili.com/x/space/arc/search?mid=514215377&ps=5&pn=1&order=pubdate&jsonp=jsonp&callback=jsonpCallback"></script>
</body>
</html>
