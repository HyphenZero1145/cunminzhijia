{{ define "main" }}
<section class="post-list-page">
  <h1>{{ .Title }}</h1>
  {{ $pages := .RegularPages }}
  {{ if $pages }}
  <ul class="post-list">
    {{ range $pages }}
    <li>
      <time>{{ .Date.Format "2006-01-02" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p class="empty-tip">暂无文章。</p>
  {{ end }}
</section>
{{ end }}
